extends: ./electron-builder.base.yml
appId: com.differentai.offlinegpt
productName: OfflineGPT Cloud
extraMetadata:
  offlinegptDistribution: cloud
protocols:
  - name: OfflineGPT Cloud
    schemes:
      - offlinegpt
publish:
  - provider: github
    owner: different-ai
    repo: offlinegpt
    releaseType: release
    channel: cloud
linux:
  executableName: offlinegpt-cloud
artifactName: offlinegpt-cloud-${os}-${arch}-${version}.${ext}
