# docker-compose.dev.yml — Dev testability stack (no custom Dockerfile)
#
# Usage (from repo root):
#   docker compose -f packaging/docker/docker-compose.dev.yml up
#
# Then open the printed Web UI URL — already wired to headless, no config needed.
#
# Env overrides (optional, via .env or export):
#   OFFLINEGPT_TOKEN        — shared client token (auto-generated if unset)
#   OFFLINEGPT_HOST_TOKEN   — host/admin token (auto-generated if unset)
#   OFFLINEGPT_WORKSPACE    — host path to mount as workspace (default: ./workspace)
#   OFFLINEGPT_PORT         — host port to map to container :8787 (default: 8787)
#   WEB_PORT              — host port to map to container :5173 (default: 5173)
#   OFFLINEGPT_DEV_ID       — unique ID for this stack (default: default)
#   OFFLINEGPT_DEV_MODE     — enables isolated OpenCode dev state
#   OFFLINEGPT_PUBLIC_HOST  — browser-facing host/IP for LAN-accessible URLs
#   OFFLINEGPT_DOCKER_DEV_MOUNT_HOST_OPENCODE=1 — import host OpenCode config/auth into the isolated dev state
#   OFFLINEGPT_OPENCODE_CONFIG_DIR      — host OpenCode config dir detection override
#   OFFLINEGPT_OPENCODE_DATA_DIR        — host OpenCode data dir detection override
#   OFFLINEGPT_HOST_OPENCODE_CONFIG_DIR — import source for OpenCode config
#   OFFLINEGPT_HOST_OPENCODE_DATA_DIR   — import source for OpenCode auth/data

x-shared: &shared
  image: node:22-bookworm-slim
  working_dir: /app
  volumes:
    # Mount the entire repo so both services share node_modules + source
    - ../../:/app
    - pnpm-store:/root/.local/share/pnpm/store
    - bun-install:/root/.bun
    - ${OFFLINEGPT_WORKSPACE:-./workspace}:/workspace
    - ${OFFLINEGPT_HOST_OPENCODE_CONFIG_DIR:-./workspace/.offlinegpt-host-opencode-config}:/persist/.config/opencode:ro
    - ${OFFLINEGPT_HOST_OPENCODE_DATA_DIR:-./workspace/.offlinegpt-host-opencode-data}:/persist/.offlinegpt-host-opencode-data:ro

services:
  offlinegpt-server:
    <<: *shared
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        # --- Ensure workspace dir is writable ---
        mkdir -p /workspace && touch /workspace/.keep 2>/dev/null || true

        # --- Install system deps ---
        apt-get update -qq && apt-get install -y -qq --no-install-recommends \
          curl ca-certificates unzip git >/dev/null 2>&1

        # --- Install bun (cached in named volume) ---
        export BUN_INSTALL="/root/.bun"
        export PATH="$$BUN_INSTALL/bin:$$PATH"
        if ! command -v bun >/dev/null 2>&1; then
          echo "[offlinegpt-server] Installing bun..."
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
        fi

        # --- Enable pnpm via corepack ---
        corepack enable && corepack prepare pnpm@10.27.0 --activate

        # --- Install deps ---
        echo "[offlinegpt-server] Installing dependencies..."
        pnpm install --no-frozen-lockfile --network-concurrency 1 --child-concurrency 1

        # --- Build the server plugins and install the pinned OpenCode binary ---
        pnpm --filter offlinegpt-server build
        OPENCODE_VERSION=$$(node -e 'const fs=require("fs"); const parsed=JSON.parse(fs.readFileSync("/app/constants.json", "utf8")); process.stdout.write(String(parsed.opencodeVersion || "").trim().replace(/^v/, ""));')
        export OPENCODE_INSTALL_DIR="/root/.opencode/bin"
        mkdir -p "$$OPENCODE_INSTALL_DIR"
        if ! command -v opencode >/dev/null 2>&1; then
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$$OPENCODE_VERSION" --no-modify-path
        fi
        export PATH="$$OPENCODE_INSTALL_DIR:$$PATH"
        export OFFLINEGPT_MANAGE_OPENCODE=1
        export OFFLINEGPT_OPENCODE_BIN="$$(command -v opencode)"
        export OFFLINEGPT_EXTENSIONS_PLUGIN_DIR="/app/apps/server/dist/opencode-plugins"

        # --- Resolve tokens ---
        if [ -z "$$OFFLINEGPT_TOKEN" ]; then
          OFFLINEGPT_TOKEN=$$(cat /proc/sys/kernel/random/uuid)
          export OFFLINEGPT_TOKEN
        fi
        if [ -z "$$OFFLINEGPT_HOST_TOKEN" ]; then
          OFFLINEGPT_HOST_TOKEN=$$(cat /proc/sys/kernel/random/uuid)
          export OFFLINEGPT_HOST_TOKEN
        fi

        # Write tokens so the web service can source them
        mkdir -p /app/tmp
        printf 'OFFLINEGPT_TOKEN=%s\nOFFLINEGPT_HOST_TOKEN=%s\n' \
          "$$OFFLINEGPT_TOKEN" "$$OFFLINEGPT_HOST_TOKEN" > "/app/tmp/.dev-env-${OFFLINEGPT_DEV_ID:-default}"

        echo ""
        echo "============================================"
        echo "  OfflineGPT server"
        echo "  Server:     http://localhost:${OFFLINEGPT_PORT:-8787}"
        echo "  Health:     http://localhost:${OFFLINEGPT_PORT:-8787}/health"
        echo "  Token:      $$OFFLINEGPT_TOKEN"
        echo "  Host token: $$OFFLINEGPT_HOST_TOKEN"
        echo "============================================"
        echo ""

        exec pnpm --filter offlinegpt-server exec bun dist/cli.js \
          --workspace /workspace \
          --host 0.0.0.0 \
          --port 8787 \
          --token "$$OFFLINEGPT_TOKEN" \
          --host-token "$$OFFLINEGPT_HOST_TOKEN" \
          --approval auto \
          --cors "*" \
          --verbose
    ports:
      - "${OFFLINEGPT_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    environment:
      CI: "true"
      OFFLINEGPT_TOKEN: ${OFFLINEGPT_TOKEN:-}
      OFFLINEGPT_HOST_TOKEN: ${OFFLINEGPT_HOST_TOKEN:-}
      OFFLINEGPT_DEV_ID: ${OFFLINEGPT_DEV_ID:-default}
      OFFLINEGPT_DEV_MODE: ${OFFLINEGPT_DEV_MODE:-1}
      OFFLINEGPT_DEV_OPENCODE_IMPORT_CONFIG_DIR: /persist/.config/opencode
      OFFLINEGPT_DEV_OPENCODE_IMPORT_DATA_DIR: /persist/.offlinegpt-host-opencode-data

  web:
    <<: *shared
    depends_on:
      offlinegpt-server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        # --- Install system deps ---
        apt-get update -qq && apt-get install -y -qq --no-install-recommends \
          curl ca-certificates >/dev/null 2>&1

        # --- Bun + pnpm ---
        export BUN_INSTALL="/root/.bun"
        export PATH="$$BUN_INSTALL/bin:$$PATH"
        if ! command -v bun >/dev/null 2>&1; then
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
        fi
        corepack enable && corepack prepare pnpm@10.27.0 --activate

        # --- Read token written by offlinegpt-server ---
        if [ -f "/app/tmp/.dev-env-${OFFLINEGPT_DEV_ID:-default}" ]; then
          . "/app/tmp/.dev-env-${OFFLINEGPT_DEV_ID:-default}"
          export VITE_OFFLINEGPT_TOKEN="$$OFFLINEGPT_TOKEN"
        fi

        echo ""
        echo "============================================"
        echo "  OfflineGPT web UI"
        echo "  URL:   http://localhost:${WEB_PORT:-5173}"
          echo "  Token: $${VITE_OFFLINEGPT_TOKEN:-<see offlinegpt-server logs>}"
        echo "============================================"
        echo ""

        export VITE_OFFLINEGPT_URL="http://${OFFLINEGPT_PUBLIC_HOST:-localhost}:${OFFLINEGPT_PORT:-8787}"
        export VITE_OFFLINEGPT_PORT="${OFFLINEGPT_PORT:-8787}"
        export VITE_ALLOWED_HOSTS="all"
        export HOST="0.0.0.0"
        export PORT="5173"

        exec pnpm --filter @offlinegpt/app exec vite \
          --host 0.0.0.0 \
          --port 5173 \
          --strictPort
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      OFFLINEGPT_DEV_ID: ${OFFLINEGPT_DEV_ID:-default}

volumes:
  pnpm-store:
    name: offlinegpt-dev-pnpm-store
  bun-install:
    name: offlinegpt-dev-bun-install
