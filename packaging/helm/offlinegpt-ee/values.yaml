nameOverride: ""
fullnameOverride: ""

image:
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  # "hosted" (default) or "airgapped". The air-gapped edition refuses settings
  # that call public services and needs inference.upstreamUrl (see
  # examples/values.airgapped.yaml).
  edition: hosted
  databaseMode: mysql
  offlinegptDevMode: "0"
  # Passed to the den-api Node.js process as NODE_OPTIONS at container startup.
  denApiNodeOptions: ""
  tenancy:
    mode: single_org
    singleOrgName: OfflineGPT
    singleOrgSlug: default
    ownerEmails: ""
    allowPublicSignup: "false"
    requireEmailVerification: "false"
  auth:
    passwordBreachScreeningEnabled: "false"
  githubConnector:
    appId: ""
    clientId: ""
  public:
    # Single public Den web origin. The chart passes this as DEN_BASE_URL; den-api
    # derives Better Auth, CORS/trusted origins, web-app hosts, API defaults, and
    # MCP resource defaults from it unless the compatibility overrides below are set.
    webOrigin: https://offlinegpt.example.com
    # Compatibility overrides for split-origin or migration deployments.
    apiOrigin: ""
    mcpResourceUrl: ""
    mcpAdditionalResources: ""
    # Leave blank to keep External MCP URL SSRF protection enabled.
    # Set "1" only for trusted private-network MCP servers.
    allowPrivateMcpUrls: ""
    mcpClaimNamespace: ""
    desktopDenBaseUrl: ""
    corsOrigins: ""
    betterAuthCookieDomain: ""
    betterAuthTrustedOrigins: ""
    webAppHosts: ""
    bootstrapAdminEmails: ""
    installLinksGatingEnabled: "false"
    # Self-hosted Automations are opt-in. Hosted OfflineGPT Cloud enables them.
    automationsEnabled: "false"
    # Self-hosted Dashboards are opt-in. Hosted environments use the same Den flag.
    dashboardsEnabled: "false"
    # OfflineGPT Web is hosted-only by default. OfflineGPT Cloud enables it explicitly.
    offlinegptWebEnabled: "false"
    # Preserve the Den runtime for published legacy Desktops during upgrades.
    # Set false only after every Desktop is v0.18.35+ to hard-disable Automations.
    automationsRuntimeEnabled: "true"
    # Enable only after compatible Desktop MCP Apps hosts are deployed.
    generatedArtifactViewsEnabled: "false"
    connectLinkMode: exchange
    connectLinkKeyId: ""
    offlinegptAppConnectUrl: ""
    offlinegptWebUrl: ""
    installerReleaseTag: ""
    installerReleaseRepo: ""
    authCallbackUrl: https://offlinegpt.example.com
  internal:
    apiBaseUrl: ""
    authFallbackBaseUrl: ""
    inferenceProxyBaseUrl: ""
  provisioner:
    mode: stub
    reconcileIntervalMs: "60000"
    reconcileStaleMs: "1200000"
    reconcileBatchSize: "10"
    workerUrlTemplate: ""
  daytona:
    apiUrl: ""
    target: ""
    snapshot: ""
    sandboxImage: ""
    sandboxCpu: ""
    sandboxMemory: ""
    sandboxDisk: ""
    sandboxPublic: ""
    sandboxAutoStopInterval: ""
    sandboxAutoArchiveInterval: ""
    sandboxAutoDeleteInterval: ""
    signedPreviewExpiresSeconds: "86400"
    sandboxNamePrefix: ""
    sharedVolumeName: ""
    volumeNamePrefix: ""
    workspaceMountPath: ""
    dataMountPath: ""
    runtimeWorkspacePath: ""
    runtimeDataPath: ""
    sidecarDir: ""
    offlinegptPort: ""
    opencodePort: ""
    createTimeoutSeconds: ""
    deleteTimeoutSeconds: ""
    healthcheckTimeoutMs: ""
  polar:
    featureGateEnabled: "false"
    apiBase: ""
    productId: ""
    benefitId: ""
    successUrl: ""
    returnUrl: ""
  inference:
    openRouterWorkspaceId: ""
    stripeInferencePriceId: ""
    openRouterUpstreamUrl: ""
    creditsPerDollar: ""
    # Self-hosted OpenAI-compatible upstream (vLLM, the vLLM router, ...).
    # Defaults to the in-chart vLLM service when vllm.enabled is true.
    upstreamUrl: ""
    # Optional JSON list of { alias, upstreamModel?, displayName?, contextLength? };
    # empty means read the upstream's GET /models.
    models: ""

observability:
  backend: none
  serviceNames:
    denApi: den-api
    denWeb: den-web
  otel:
    endpoint: ""
    tracesEndpoint: ""
    metricsEndpoint: ""
    logsEndpoint: ""
    protocol: http/protobuf
    exporters:
      traces: otlp
      metrics: otlp
      logs: otlp
    tracesSampler: parentbased_always_on
    tracesSamplerArg: ""
    headers:
      existingSecret: ""
      key: OTEL_EXPORTER_OTLP_HEADERS

customCa:
  enabled: false
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt

redis:
  # Prefer rediss:// DATABASE_REDIS_URL values. Set this to true only for
  # trusted private, non-public Redis endpoints that do not support TLS, such as
  # some managed internal Redis URLs exposed by hosting platforms.
  allowInsecureInternal: false

secret:
  create: true
  existingSecret: ""
  keys:
    databaseUrl: DATABASE_URL
    databaseRedisUrl: DATABASE_REDIS_URL
    betterAuthSecret: BETTER_AUTH_SECRET
    denDbEncryptionKey: DEN_DB_ENCRYPTION_KEY
    daytonaApiKey: DAYTONA_API_KEY
    polarAccessToken: POLAR_ACCESS_TOKEN
    openRouterManagementApiKey: OPENROUTER_MANAGEMENT_API_KEY
    inferenceAdminToken: INFERENCE_ADMIN_TOKEN
    inferenceWebhookSecret: INFERENCE_WEBHOOK_SECRET
    emailFrom: EMAIL_FROM
    smtpHost: SMTP_HOST
    smtpPort: SMTP_PORT
    smtpUser: SMTP_USER
    smtpPass: SMTP_PASS
    smtpSecure: SMTP_SECURE
    githubConnectorAppClientSecret: GITHUB_CONNECTOR_APP_CLIENT_SECRET
    githubConnectorAppPrivateKey: GITHUB_CONNECTOR_APP_PRIVATE_KEY
    githubConnectorAppWebhookSecret: GITHUB_CONNECTOR_APP_WEBHOOK_SECRET
    connectLinkPrivateKey: DEN_CONNECT_LINK_PRIVATE_KEY
    initialAdminBootstrapCode: DEN_INITIAL_ADMIN_BOOTSTRAP_CODE
  values:
    databaseUrl: mysql://offlinegpt:change-me@mysql:3306/offlinegpt_den
    databaseRedisUrl: ""
    betterAuthSecret: CHANGE_ME_32_CHARS_MINIMUM_BETTER_AUTH
    denDbEncryptionKey: CHANGE_ME_32_CHARS_MINIMUM_DB_ENCRYPTION
    daytonaApiKey: ""
    polarAccessToken: ""
    openRouterManagementApiKey: ""
    inferenceAdminToken: ""
    inferenceWebhookSecret: ""
    emailFrom: ""
    smtpHost: ""
    smtpPort: "587"
    smtpUser: ""
    smtpPass: ""
    smtpSecure: "false"
    githubConnectorAppClientSecret: ""
    githubConnectorAppPrivateKey: ""
    githubConnectorAppWebhookSecret: ""
    connectLinkPrivateKey: ""
    initialAdminBootstrapCode: ""

installerArtifacts:
  enabled: false
  existingClaim: ""
  hostPath: ""
  mountPath: /var/lib/offlinegpt/installer-artifacts

denApi:
  replicaCount: 1
  image:
    repository: ghcr.io/soumyacodes007/offline-gpt-den-api
    tag: ""
  service:
    type: ClusterIP
    port: 8788
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8788
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

denWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/soumyacodes007/offline-gpt-den-web
    tag: ""
  service:
    type: ClusterIP
    port: 3005
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 3005
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 18

inference:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/soumyacodes007/offline-gpt-inference
    tag: ""
  service:
    type: ClusterIP
    port: 8791
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8791
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

migrations:
  enabled: true
  hook: true
  hookDeletePolicy: before-hook-creation,hook-succeeded
  backoffLimit: 2
  activeDeadlineSeconds: 600
  podAnnotations: {}
  resources: {}
  command:
    - node
  args:
    - /app/ee/packages/den-db/dist/scripts/bootstrap.js

ingress:
  enabled: false
  className: ""
  annotations: {}
  web:
    host: offlinegpt.example.com
    path: /
    pathType: Prefix
  api:
    enabled: true
    host: api.offlinegpt.example.com
    path: /
    pathType: Prefix
  tls: []

# Self-hosted model server for the air-gapped edition. The model is read from
# a PersistentVolumeClaim prepared offline; nothing is downloaded.
vllm:
  enabled: false
  image:
    repository: vllm/vllm-openai
    tag: v0.11.0
  modelsClaim: ""
  modelDir: Qwen2.5-0.5B-Instruct
  servedModelName: main
  maxModelLen: 8192
  gpuMemoryUtilization: "0.85"
  toolCallParser: hermes
  extraArgs: []
  containerPort: 8000
  resources:
    limits:
      nvidia.com/gpu: 1
  nodeSelector: {}
  tolerations: []
